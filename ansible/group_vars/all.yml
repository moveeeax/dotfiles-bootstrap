---
# The documented toolset installed by playbook.yml. Edit this list, not the play.
dev_packages:
  - git
  - vim
  - tmux
  - curl
  - wget
  - jq
  - ripgrep
  - fzf
  - htop
  - unzip

# Set to false to skip sudo for apt/dnf/pacman (rarely useful). Homebrew on macOS never uses sudo.
dotfiles_become: true
